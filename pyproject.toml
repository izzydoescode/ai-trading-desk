[project]
name = "ai-trading-desk"
version = "0.1.0"
description = "Evidence-grounded market research with independent adversarial review"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.11,<3", "httpx>=0.28,<1"]

[project.scripts]
trading-desk = "trading_desk.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
