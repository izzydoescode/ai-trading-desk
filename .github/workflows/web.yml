name: Terminal UI quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    name: web (node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # The gate covers what ships to the browser. Build and test tools are audited too, but
      # only reported: GHSA-fc5q-39xc-vjpf (picomatch, used by Vite and Vitest) has no patched
      # release, so gating on it would block every pull request with nothing to upgrade to.
      # Make the second step blocking again once picomatch publishes a fix.
      - name: Dependency audit (shipped dependencies, blocking)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Dependency audit (build and test tools, report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
